spring:
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID:dummy-not-configured}
            client-authentication-method: none
            authorization-grant-type: authorization_code
            redirect-uri: "http://localhost:8080/login/oauth2/code/kakao"
            scope:
              - profile_nickname
  datasource:
    #TRIPLOG_DB_PATH가 있으면→ 지정 경로 사용 ,없으면→ 현재 실행 디렉터리의 ./db_dev 사용
    url: jdbc:h2:file:${TRIPLOG_DB_PATH:./db_dev};MODE=MySQL;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true  # 쿼리 보기 좋게 포맷
    hibernate:
      ddl-auto: update
    # Hibernate가 스키마를 먼저 만든 뒤 spring.sql.init이 실행되도록 지연 —
    # 기본값(false)이면 INSERT가 테이블 생성보다 먼저 시도되어 "table not found" 발생
    defer-datasource-initialization: true
  sql:
#    init:
#      # dev 프로파일에서만 항상 실행 (application-dev.yml에 위치하므로 다른 프로파일은 영향 없음)
#      mode: always
#      # scripts/는 classpath가 아닌 프로젝트 루트 하위이므로 file: 프리픽스 사용
#      # (bootRun의 working directory는 back/ 이라 상대 경로가 맞음)
#      data-locations: file:./scripts/seed-past-mates.sql
#      # 재실행 시 trip_groups.join_code unique 등 충돌은 스킵 —
#      # 완전 초기화가 필요하면 db_dev.mv.db 파일 삭제 후 재기동
#      continue-on-error: true
logging:
  level:
    com.back : DEBUG

app:
  s3:
    bucket: triplog-bucket