spring:
  datasource:
    url: jdbc:h2:mem:db_test;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  mail:
    host: localhost
    port: 25
    username: test
    password: test
  data:
    redis:
      host: localhost
      port: 6379
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: dummy-test-client-id
            client-authentication-method: none
            authorization-grant-type: authorization_code
            redirect-uri: "http://localhost:8080/login/oauth2/code/kakao"
            scope:
              - profile_nickname

app:
  s3:
    bucket: trip-bucket

# test 프로파일에서는 Firebase Admin SDK 로드 강제 OFF —
# application.yml의 기본값(true)이 상속되면 credentials 없이 FirebaseApp 초기화하다 컨텍스트 로드 실패.
# 실제 push 기능은 test 프로파일 대상이 아니므로 안전하게 비활성화.
firebase:
  enabled: false
