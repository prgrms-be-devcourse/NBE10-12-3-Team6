spring:
  application:
    name: back
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev,local}
  security:
    oauth2:
      client:
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
  datasource:
    hikari:
      auto-commit: false
      maximum-pool-size: 50
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:test@example.com}
    password: ${MAIL_PASSWORD:test}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

springdoc:
  default-produces-media-type: application/json;charset=UTF-8
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.orm.jdbc.extract: TRACE
    org.springframework.transaction.interceptor: TRACE
    org.springframework.security: debug
jwt:
  secret: "this-is-a-very-long-secret-key-for-jwt-signing-minimum-256-bits" # 256비트 이상이어야 HS256 서명 가능
  access-expiration: 1800000   # 30분 (ms)

file:
  upload:
    dir: ${user.home}/triplog/uploadedimages
    base-url: ${FILE_UPLOAD_BASE_URL:http://localhost:8080}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://192.168.0.5:3000}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000/}
firebase: #다른 테스트를 위해 실행시 파이어베이스 값을 임시로 false로 설정, 파이어베이스 테스트 시 true로 변경해야함
  #슬랙에 업로드된 사용자용 키를 활성화하는거라 개별적으로 환경 변수를 등록해줘야함
  # ex) FIREBASE_ENABLED=true;GOOGLE_APPLICATION_CREDENTIALS=C:\{개별 설정 경로}\notification-firebase-adminsdk.json
  enabled: ${FIREBASE_ENABLED:false}
