name: Gemini AI Code Review

on:
  pull_request:
    types: [opened, synchronize] # PR이 열리거나 새 커밋이 푸시될 때 작동

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # PR에 댓글을 달기 위한 권한

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gemini 코드 리뷰 실행
        uses: sshnaidm/gemini-code-review-action@v2
        with:
          gemini-key: ${{ secrets.GEMINI_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          model: "gemini-3.6-flash"
          prompt: |
            당신은 시니어 Java Spring Boot 백엔드 개발자입니다. 
            다음 PR의 코드 변경 사항을 꼼꼼하게 리뷰해주세요.
            
            [리뷰 중점 사항]
            1. 객체 지향적인 설계 원칙(SOLID)이 잘 지켜졌는지 확인
            2. JPA 엔티티 매핑이나 쿼리 성능 저하 가능성(N+1 문제 등) 확인
            3. 적절한 예외 처리 및 Transactional 처리 확인
            4. 불필요한 코드나 더 나은 Java 문법(Stream API 등) 제안
            
            반드시 한국어로 친절하게 답변해주고, 개선이 필요한 코드는 마크다운으로 예시를 보여주세요.
