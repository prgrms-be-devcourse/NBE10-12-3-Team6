name: Deploy Next.js to Oracle Cloud

# ────────────────────────────────────────────────────────────
# 트리거 조건
#   - main 브랜치에 deploy-version-front.yml 파일이 변경되어 push될 때 자동 실행
#   - 또는 GitHub Actions UI에서 수동으로 실행 가능 (workflow_dispatch)
# ────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - dev
    paths:
      - deploy-version-front.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write   # ghcr.io에 이미지 push 권한

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/triplog-frontend-v2
  CONTAINER_NAME: next-frontend-v2
  TARGET_DIR: /home/ubuntu/triplog/front
  HOST_PORT: 3000
  CONTAINER_PORT: 3000

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04-arm

    steps:
      # [1] GitHub 레포지토리 코드를 Actions Runner(빌드 서버)에 내려받기
      - name: 🍏 Checkout Repository
        uses: actions/checkout@v4

      # [2] deploy-version-front.yml에서 version 값을 읽어 이미지 태그로 사용
      - name: 🍏 Extract version
        run: |
          VERSION=$(jq -r .version < deploy-version-front.yml)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      # [3] GitHub Secrets에 등록된 값으로 .env 파일 생성
      #     - ./front/.env로 저장하는 이유:
      #       NEXT_PUBLIC_* 값은 `next build` 시점에 클라이언트 번들로 인라인되므로
      #       빌드 컨텍스트(./front) 안에 .env가 있어야 함. 런타임 --env-file만으론 브라우저에 안 잡힘.
      #     - .dockerignore가 없어서 COPY . . 로 자연스럽게 이미지에 포함됨
      #     - env: 매핑을 쓰는 이유: 시크릿 값에 셸 특수문자($, ", \, 개행 등)가 있어도
      #       안전하게 변수로 전달됨. `${{ secrets.X }}` 를 셸에 직접 박으면 값에 따라 스크립트가 깨질 수 있음.
      #     - tr -d '\r\n': 시크릿 복붙 시 실수로 들어간 CR/LF 제거.
      #       Next.js는 --env-file은 아니지만 dotenv 파서도 개행 들어가면 파싱이 이상해질 수 있음.
      - name: 🍏 Create .env file from Secrets
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_API_BASE: ${{ secrets.NEXT_PUBLIC_API_BASE }}
          PUBLIC_FIREBASE_VAPID_KEY: ${{ secrets.PUBLIC_FIREBASE_VAPID_KEY }}
        run: |
          echo "KAKAO_REST_API_KEY=$(printf '%s' "$KAKAO_REST_API_KEY" | tr -d '\r\n')" > front/.env
          echo "NEXT_PUBLIC_FIREBASE_API_KEY=$(printf '%s' "$NEXT_PUBLIC_FIREBASE_API_KEY" | tr -d '\r\n')" >> front/.env
          echo "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=$(printf '%s' "$NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN" | tr -d '\r\n')" >> front/.env
          echo "NEXT_PUBLIC_FIREBASE_PROJECT_ID=$(printf '%s' "$NEXT_PUBLIC_FIREBASE_PROJECT_ID" | tr -d '\r\n')" >> front/.env
          echo "NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=$(printf '%s' "$NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET" | tr -d '\r\n')" >> front/.env
          echo "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=$(printf '%s' "$NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID" | tr -d '\r\n')" >> front/.env
          echo "NEXT_PUBLIC_FIREBASE_APP_ID=$(printf '%s' "$NEXT_PUBLIC_FIREBASE_APP_ID" | tr -d '\r\n')" >> front/.env
          echo "NEXT_PUBLIC_API_BASE=$(printf '%s' "$NEXT_PUBLIC_API_BASE" | tr -d '\r\n')" >> front/.env
          echo "PUBLIC_FIREBASE_VAPID_KEY=$(printf '%s' "PUBLIC_FIREBASE_VAPID_KEY" | tr -d '\r\n')" >> front/.env

      # [4] ghcr.io 로그인 (GITHUB_TOKEN은 Actions에서 자동 발급, 별도 등록 불필요)
      - name: 🍏 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # [5] arm64 크로스 플랫폼 빌드를 위한 QEMU 에뮬레이터 설치
#      - name: 🍏 Set up QEMU
#        uses: docker/setup-qemu-action@v3
#        with:
#          platforms: linux/arm64

      # [6] 멀티 플랫폼 Docker 이미지 빌드를 위한 Buildx 설정
      - name: 🍏 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # [7] arm64 이미지 빌드 후 ghcr.io에 push
      #     tarball 저장/전송 없이 registry에 직접 업로드
      - name: 🍏 Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./front
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.VERSION }}

      # [8] .env 파일을 서버로 전송 (런타임 --env-file용, 서버 컴포넌트/API 라우트가 참조)
      #     NEXT_PUBLIC_* 값은 이미 빌드 타임에 번들에 박혀 있어서 런타임 주입은 부수적임
      - name: 🍏 Copy .env to Oracle Cloud
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.HOST }}
          username: ubuntu
          key: ${{ secrets.KEY }}
          source: front/.env
          target: ${{ env.TARGET_DIR }}
          strip_components: 1

      # [9] SSH로 서버에 접속하여 ghcr.io에서 이미지 pull 후 컨테이너 교체
      #     --restart unless-stopped: 서버 재부팅 시 컨테이너 자동 재시작
      - name: 🐳 Deploy on Oracle Cloud VM via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ubuntu
          key: ${{ secrets.KEY }}
          envs: GITHUB_TOKEN,GITHUB_ACTOR,IMAGE_NAME,VERSION,CONTAINER_NAME,HOST_PORT,CONTAINER_PORT,TARGET_DIR
          script: |
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            docker pull $IMAGE_NAME:$VERSION
            docker stop $CONTAINER_NAME || true
            docker rm $CONTAINER_NAME || true
            docker run -d \
              --name $CONTAINER_NAME \
              --restart unless-stopped \
              --env-file $TARGET_DIR/.env \
              -p $HOST_PORT:$CONTAINER_PORT \
              $IMAGE_NAME:$VERSION
            docker image prune -f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          VERSION: ${{ env.VERSION }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          HOST_PORT: ${{ env.HOST_PORT }}
          CONTAINER_PORT: ${{ env.CONTAINER_PORT }}
          TARGET_DIR: ${{ env.TARGET_DIR }}

      # [10] Actions Runner에 남아있는 임시 파일 삭제
      - name: 🍏 Clean up local temp files
        if: always()
        run: rm -f front/.env
